name: Gerar APK Android

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          mkdir source
          unzip -q Futebol_Manager_27_Android_v3.3.0_Preparacao_APK.zip -d source

      - name: Compilar APK e executar testes
        run: |
          cd source
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Futebol-Manager-27-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
