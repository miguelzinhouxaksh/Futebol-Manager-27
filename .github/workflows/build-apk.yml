name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Compilar Futebol Manager 27
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' ! -iname '*correcao*' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP do projeto nao encontrado."
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          if [ ! -f project/settings.gradle.kts ] && [ ! -f project/settings.gradle ]; then
            echo "ERRO: arquivo settings.gradle nao encontrado."
            exit 1
          fi

      - name: Gerar APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Futebol-Manager-27-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
